{% extends "base.html" %}

{% block title %}Quiz Result - {{ quiz.quiz_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0 text-center p-4">
            <div class="card-body">
                <h4 class="fw-bold mb-2">{{ quiz.quiz_name }}</h4>
                <p class="text-muted mb-3">Quiz completed</p>
                <h1 class="display-5 fw-bold text-primary">{{ record.score }}</h1>
                <p class="text-secondary">points scored</p>
                <a href="{{ url_for('course.listCourses') }}" class="btn btn-outline-primary btn-sm mt-3">Back to Courses</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
